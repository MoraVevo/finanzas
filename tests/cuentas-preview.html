<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prueba de cuentas · datos ficticios</title><link rel="stylesheet" href="../css/app.css"></head>
<body><div style="max-width:520px;margin:auto;padding:10px;font-size:12px">Datos ficticios · prueba sin guardar en la base de datos.
<button id="cuentas" class="chip">Ver Cuentas</button><button id="stats" class="chip">Ver Estadísticas</button>
<button id="vacio" class="chip">Escenario vacío</button></div><div id="app"></div>
<script src="../vendor/dexie.min.js"></script><script type="module">
import { html, render } from '../vendor/preact-standalone.module.js';
import { setState } from '../js/store.js';
import fin from '../js/db.js';
import Estadisticas from '../js/screens/estadisticas.js';
import Cuentas from '../js/screens/cuentas.js';
import { isoDia, claveMesActual } from '../js/util.js';
const cuentas = [
  { id: 'b', nombre: 'Banco de prueba', tipo: 'bancaria', moneda: 'GTQ', saldoInicial: 500000 },
  { id: 't', nombre: 'Tarjeta de prueba', tipo: 'tarjeta', moneda: 'GTQ', saldoInicial: 0, limite: 1000000 },
  { id: 'a', nombre: 'Ahorro de prueba', tipo: 'ahorro', moneda: 'GTQ', saldoInicial: 0 },
];
const fecha = claveMesActual() + '-01';
let txs = [
  { id: '1', cuenta: 'b', tipo: 'ingreso', monto: 200000, moneda: 'GTQ', fecha, categoria: 'salario' },
  { id: '2', cuenta: 'b', tipo: 'gasto', monto: 50000, moneda: 'GTQ', fecha: isoDia(), categoria: 'comida' },
  { id: '3', cuenta: 'b', cuentaDestino: 't', tipo: 'transferencia', monto: 80000, moneda: 'GTQ', fecha },
  { id: '4', cuenta: 'a', cuentaDestino: 'b', tipo: 'transferencia', monto: 30000, moneda: 'GTQ', fecha },
];
fin.todasTx = async () => txs;
setState({ listo: true, cuentas, categorias: [{ id: 'salario', tipo: 'ingreso', nombre: 'Salario', emoji: '💰' }, { id: 'comida', tipo: 'gasto', nombre: 'Comida', emoji: '🍔' }],
  ajustes: { iniciado: true, monedaPrincipal: 'GTQ' }, tasas: [], fijos: [], cuotas: [], presupuestos: [], futuros: [] });
const mostrar = componente => { render(null, document.getElementById('app')); render(html`<${componente} />`, document.getElementById('app')); };
document.getElementById('cuentas').onclick = () => mostrar(Cuentas);
document.getElementById('stats').onclick = () => mostrar(Estadisticas);
document.getElementById('vacio').onclick = () => { txs = []; mostrar(Estadisticas); };
mostrar(Estadisticas);
</script></body></html>
